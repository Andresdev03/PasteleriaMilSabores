<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pastelería 1000 Sabores - Catálogo</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
</head>
<body>
<header>
    <h1>Pastelería 1000 Sabores</h1>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="registro.html">Registro</a>
    </nav>
</header>

<main>
    <section>
        <h2>Catálogo de productos</h2>

        <label for="busqueda">Buscar producto:</label>
        <input type="text" id="busqueda" placeholder="Ej: chocolate, vainilla...">

        <label for="filtro-categoria">Filtrar por categoría:</label>
        <select id="filtro-categoria">
            <option value="">Todas</option>
            <option value="Tortas Cuadradas">Tortas Cuadradas</option>
            <option value="Tortas Circulares">Tortas Circulares</option>
            <option value="Postres Individuales">Postres Individuales</option>
            <option value="Productos Sin Azúcar">Productos Sin Azúcar</option>
            <option value="Pastelería Tradicional">Pastelería Tradicional</option>
            <option value="Productos Sin Gluten">Productos Sin Gluten</option>
            <option value="Productos Vegana">Productos Vegana</option>
            <option value="Tortas Especiales">Tortas Especiales</option>
        </select>
    </section>

    <section id="lista-productos" class="grid-productos">
        <!-- Los productos se renderizan con JavaScript -->
    </section>

    <section id="carrito">
        <h2>Carrito de compras</h2>
        <div id="lista-carrito">
            <!-- Items del carrito -->
        </div>
        <div id="resumen-carrito">
            <p>Subtotal: $<span id="subtotal">0</span> CLP</p>
            <p>Descuento: $<span id="descuento">0</span> CLP</p>
            <p>Total: $<span id="total">0</span> CLP</p>
        </div>
        <button id="vaciar-carrito">Vaciar carrito</button>
    </section>
</main>

<footer>
    <p>© 2026 Pastelería 1000 Sabores - Santiago, Chile</p>
    <p>Desarrollado para la asignatura Desarrollo FullStack II</p>
</footer>

<script src="js/app.js"></script>
</body>
</html>
